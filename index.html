<!doctype html>
<html lang="en" data-app="wren">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Wren — local sticky notes</title>
    <meta
      name="description"
      content="Wren is a sticky-notes app that stores rich-text notes as Markdown files on your own PC. No cloud, no lock-in."
    />
    <meta name="theme-color" content="#2B4A8B" />

    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.json" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wren — local sticky notes" />
    <meta
      property="og:description"
      content="Rich-text sticky notes stored as Markdown files on your own PC. PWA + Chrome extension."
    />
    <meta property="og:image" content="./og-card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./src/styles/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
