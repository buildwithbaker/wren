<!doctype html>
<html lang="en" data-app="wren">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Wren — local sticky notes</title>
    <meta
      name="description"
      content="Wren is a sticky-notes app that stores rich-text notes as Markdown files on your own PC. No cloud, no lock-in."
    />
    <meta name="theme-color" content="#8B5E3C" />

    <!--
      Content Security Policy.

      Phase 1 of Drive sync adds Google Identity Services (script-src,
      style-src, frame-src on accounts.google.com/gsi/) and the Drive REST
      endpoint (connect-src on www.googleapis.com). The 'unsafe-inline' on
      style-src is required by Wren's own runtime style mutations (Tiptap
      attribute styles, ProseMirror selection styles); it can be tightened
      with hashes in a future pass.

      Decision provenance: KB Module 05, P1.7. The connect-src for
      www.googleapis.com is NOT in the GIS docs but is mandatory because
      Wren's Drive REST calls land there.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' https://accounts.google.com/gsi/ https://www.googleapis.com/; frame-src https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https:; font-src 'self' data:; manifest-src 'self'; object-src 'none'; base-uri 'self'"
    />

    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./icon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180.png" />
    <link rel="manifest" href="./manifest.json" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wren — local sticky notes" />
    <meta
      property="og:description"
      content="Rich-text sticky notes stored as Markdown files on your own PC. PWA + Chrome extension."
    />
    <meta property="og:image" content="./og-card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./src/styles/style.css" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('wren.theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
